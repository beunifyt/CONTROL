<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0d1117" />
  <title>UnifyT</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="shared/styles/tokens.css" />
  <link rel="stylesheet" href="shared/styles/base.css" />
  <link rel="stylesheet" href="shared/styles/themes.css" />
  <link rel="stylesheet" href="shared/styles/components.css" />
</head>
<body data-theme="dark">
  <!-- Splash inicial mientras carga el core -->
  <div id="splash" class="splash">
    <div class="splash-logo">UnifyT</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- Contenedor único: el router pinta todo aquí -->
  <div id="app" hidden>
    <header id="app-header"></header>
    <nav id="app-nav"></nav>
    <main id="app-main"></main>
    <div id="app-modals"></div>
    <div id="app-toasts"></div>
  </div>

  <!-- Punto único de entrada -->
  <script type="module" src="core/app.js"></script>
</body>
</html>
