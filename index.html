<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0F1729">
  <title>BeUnifyT — Control Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="boot" class="boot-screen">
  <div class="boot-logo">
    <div class="boot-logo-ic">
      <svg viewBox="0 0 24 24" fill="none" width="32" height="32">
        <path d="M12 2 4 5v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V5l-8-3z" stroke="#fff" stroke-width="2" stroke-linejoin="round" fill="#2563EB"/>
      </svg>
    </div>
    <div>
      <div class="boot-title">BeUnifyT</div>
      <div class="boot-sub">Control Platform</div>
    </div>
  </div>
  <div class="boot-spinner"></div>
</div>

<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-logo">
      <div class="boot-logo-ic">
        <svg viewBox="0 0 24 24" fill="none" width="28" height="28">
          <path d="M12 2 4 5v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V5l-8-3z" stroke="#fff" stroke-width="2" stroke-linejoin="round" fill="#2563EB"/>
        </svg>
      </div>
      <div>
        <div class="login-title">BeUnifyT</div>
        <div class="login-sub">Control Platform</div>
      </div>
    </div>
    <div id="login-body"></div>
    <div id="login-error" class="login-error hidden"></div>
  </div>
</div>

<div id="pending-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-logo">
      <div class="boot-logo-ic" style="background:#FEF3C7">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#92400E" stroke-width="2"><path d="M12 8v5"/><path d="M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <div>
        <div class="login-title">Cuenta pendiente</div>
        <div class="login-sub">Esperando aprobación</div>
      </div>
    </div>
    <p style="color:#475569;font-size:14px;margin:0 0 16px">
      Tu cuenta ha sido creada pero aún no tiene acceso. Pide a un administrador que la active o que te envíe un código de invitación.
    </p>
    <button class="btn btn-secondary btn-full" onclick="window.beunifyt.signOut()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="app-shell hidden">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <div class="boot-logo-ic">
        <svg viewBox="0 0 24 24" fill="none" width="22" height="22">
          <path d="M12 2 4 5v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V5l-8-3z" stroke="#fff" stroke-width="2" stroke-linejoin="round" fill="#2563EB"/>
        </svg>
      </div>
      <div class="sidebar-head-text">
        <div class="sidebar-title">BeUnifyT</div>
        <div class="sidebar-sub">Control Platform</div>
      </div>
      <button class="sidebar-collapse-btn" title="Plegar/desplegar menú" onclick="window.beunifyt.toggleSidebarCollapse()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
    </div>
    <nav id="sidebar-nav" class="sidebar-nav"></nav>
    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div id="user-avatar" class="user-avatar">·</div>
        <div class="user-info">
          <div id="user-name" class="user-name">—</div>
          <div id="user-role" class="user-role">—</div>
        </div>
        <button class="user-out" title="Cerrar sesión" onclick="window.beunifyt.signOut()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="hamburger" class="hamburger" onclick="window.beunifyt.toggleSidebar()" aria-label="Menú">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-spacer"></div>
      <div id="sync-indicator" class="sync-ind sync-ok" title="Sincronización"><span class="sync-dot"></span><span id="sync-text">Sincronizado</span></div>
      <button class="topbar-btn" title="Preferencias" onclick="window.beunifyt.openUserPrefs()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="topbar-btn" title="Notificaciones">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="notif-badge" class="notif-badge hidden">0</span>
      </button>
    </header>
    <section id="page" class="page"></section>
  </main>

  <div id="backdrop" class="backdrop" onclick="window.beunifyt.toggleSidebar(false)"></div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
