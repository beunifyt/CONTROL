name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Si no existe el secret, se omite el deploy (sin fallar el workflow)
      - name: Check credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Falta el secret FIREBASE_SERVICE_ACCOUNT. Deploy a Firebase omitido."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Firebase Hosting
        if: steps.creds.outputs.ok == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: control-f84ee
          target: control-f84ee
          channelId: live

      # Reglas de seguridad de Firestore (firestore.rules). Sin ellas, la base de datos
      # queda con las reglas que haya en la consola. Si la cuenta de servicio no tiene
      # el rol "Firebase Rules Admin", este paso avisa y no rompe el deploy de la web.
      - name: Deploy Firestore rules
        if: steps.creds.outputs.ok == 'true'
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only firestore:rules --project control-f84ee --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
