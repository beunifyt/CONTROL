name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          echo "$FIREBASE_CREDENTIALS" > /tmp/firebase-key.json
          firebase deploy --token "$FIREBASE_TOKEN" --project devolucioncontrol-v5
      
      - name: Verify deployment
        run: |
          echo "✓ Firebase deployment successful"
          echo "Project: devolucioncontrol-v5"
          echo "Rules updated: database.rules.json, firestore.rules"
